name: Node.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/node-cicd-demo:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/node-cicd-demo:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/node-cicd-demo:latest

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-cicd-demo:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-cicd-demo:latest